<!DOCTYPE html>
<html lang="ja">
        <head>
        <meta charset="UTF-8">
        <meta name="vewport" content="width=device-width, initial-scale=1.0">
        <title>オンラインミニゲーム.ブラックジャック(1人用)</title>
        <link rel="stylesheet" href="../blackjack.css">
    </head>
    <body>
        <div class="bj-title">
            <h1 id="bj-title">ブラックジャック</h1>
        </div>
        <p><a href="../blackjack-lobby.html">モード選択へ戻る</a></p>
        <div id="screen-game" class="screen">
            <div id="dealer-area">
                <h2>ディーラー <span id="dealer-score"></span> <span id="dealer-status"></span></h2>
                <div id="dealer-cards"></div>
            </div>
            <div id="player-area">
                <h2>あなた <span id="player-score"></span> <span id="player-status"></span></h2>
                <div id="player-cards"></div>
                <div id="player-buttons">
                    <button id="hit-button">ヒット</button> <button id="stand-button">スタンド</button> <button id="restart-button" hidden>もう一度プレイ</button>
                </div>
            </div>
            <span id="win-or-lose"></span>
        </div>
        <script type="module" src="scripts/main.js"></script>
