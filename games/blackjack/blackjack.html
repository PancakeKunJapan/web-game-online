<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="vewport" content="width=device-width, initial-scale=1.0">
        <title>オンラインミニゲーム.ブラックジャック</title>
    </head>
    <body>
        <div class="bj-title">
            <h1 id="bj-title">ブラックジャック</h1>
        </div>
        <div id="the-bj-body">
            <p><a href="../../index.html">タイトルへ戻る</a></p>
        </div>
        
        <div id="screen-start" class="screen">
            <button id="start-button">ゲームを開始</button>
        </div>

        <div id="screen-mode-select" class="screen" hidden>
            <button id="mode-select-return">戻る</button>
            <button id="single-mode-button">一人で遊ぶ</button>
            <button id="vs-mode-button">対戦で遊ぶ(開発中)</button>
        </div>

        <div id="screen-game" class="screen" hidden>
            <div id="dealer-area">
                <h2>ディーラー <span id="dealer-score"></span> <span id="dealer-status"></span></h2>
                <div id="dealer-cards"></div>
            </div>
            <div id="player-area">
                <h2>あなた <span id="player-score"></span> <span id="player-status"></span></h2>
                <div id="player-cards"></div>
                <div id="player-buttons">
                    <button id="hit-button">ヒット</button> <button id="stand-button">スタンド</button> <button id="restart-button" hidden>もう一度プレイ</button>
                </div>
            </div>
            <span id="win-or-lose"></span>
        </div>

        <script type="module" src="scripts/main.js"></script>5
    </body>
</html>
